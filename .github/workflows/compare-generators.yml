name: Compare Generators

# Manual A/B for the direct-API generator (scripts/generate-briefing.mjs)
# against the `claude -p` path the daily send still uses.
#
# It generates a candidate edition and scores it, and does nothing else: no
# Telegram send, no KV write, no commit back to state/. The day's real edition
# is already in the checkout at state/today_briefing.md, so the comparison
# costs one generation rather than two.
#
# Deliberately NOT in the `briefing-generation` concurrency group: it shares no
# state with the real pipeline, so there is nothing to serialise against, and
# joining that group would leave a manual experiment queued behind a real send.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model for the candidate run
        default: claude-opus-4-8
      effort:
        description: 'output_config.effort: low | medium | high | xhigh | max'
        default: medium
      max_searches:
        description: Ceiling on billed web searches
        default: '12'
      search_mode:
        description: 'direct (full results in context) | filtered (dynamic filtering)'
        default: direct
      domains:
        description: 'allow (curated source list) | none (open web) | a comma-separated list'
        default: allow
      source:
        description: 'firecrawl (news search, stories supplied to the model) | web_search (model searches for itself)'
        default: firecrawl

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - name: Pin today's date
        run: |
          echo "BRIEFING_DATE_ISO=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "BRIEFING_DATE_HUMAN=$(date -u '+%-d %B %Y')" >> "$GITHUB_ENV"

      # Date note only, no recency note. build-recency-note.mjs tells the model
      # not to repeat stories from recent editions -- including the one this run
      # is being compared against, which would handicap the candidate into
      # hunting for second-choice stories. Without it, both generators face the
      # same problem, and overlap between them reads as agreement rather than
      # as a repeat.
      # Two candidates share this step. firecrawl: the news search runs first and
      # its stories go into the prompt, so the model composes and never
      # searches. web_search: the model searches for itself, the path the first
      # four A/B runs measured.
      - name: Generate candidate edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          BRIEFING_MODEL: ${{ inputs.model }}
          BRIEFING_EFFORT: ${{ inputs.effort }}
          BRIEFING_MAX_SEARCHES: ${{ inputs.max_searches }}
          BRIEFING_SEARCH_MODE: ${{ inputs.search_mode }}
          BRIEFING_ALLOWED_DOMAINS: ${{ inputs.domains }}
          BRIEFING_COST_LOG: state/candidate_cost_log.jsonl
          BRIEFING_DEBUG_DIR: state/candidate_debug
          SOURCE: ${{ inputs.source }}
        run: |
          NOTE=$(node scripts/build-date-note.mjs)
          if [ "$SOURCE" = "firecrawl" ]; then
            node scripts/fetch-news.mjs > state/candidate_stories.md
            STORIES=$(cat state/candidate_stories.md)
            BRIEFING_SEARCH_MODE=none node scripts/generate-briefing.mjs \
              briefing-prompt-curated.md "${NOTE}"$'\n\n'"${STORIES}" > state/candidate_briefing.md
          else
            node scripts/generate-briefing.mjs briefing-prompt.md "$NOTE" > state/candidate_briefing.md
          fi

      - name: Score the candidate
        run: |
          echo "### Candidate (${{ inputs.model }}, effort ${{ inputs.effort }}, search ${{ inputs.search_mode }}, domains ${{ inputs.domains }})" >> "$GITHUB_STEP_SUMMARY"
          node scripts/score-briefing.mjs state/candidate_briefing.md | tee -a "$GITHUB_STEP_SUMMARY"

      # The incumbent is scored from the committed file, so this costs nothing
      # and reflects exactly what subscribers received this morning.
      - name: Score the edition that actually went out
        run: |
          echo "### Incumbent (claude -p, today's real edition)" >> "$GITHUB_STEP_SUMMARY"
          node scripts/score-briefing.mjs state/today_briefing.md | tee -a "$GITHUB_STEP_SUMMARY"

      # What the search returned. Without this a "nothing usable" edition is a
      # dead end: the scores say zero items and nothing says why.
      - name: What the searches returned
        if: always()
        run: |
          {
            echo '### Searches'
            echo '```'
            if [ -f state/candidate_stories.md ]; then
              cat state/candidate_stories.md
            else
              node scripts/dump-search-log.mjs state/candidate_debug
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: What the candidate cost
        run: |
          {
            echo '### Candidate cost'
            echo '```json'
            cat state/candidate_cost_log.jsonl
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Both editions side by side, for the editorial judgment the scorer
      # cannot make: is the candidate's selection as good, not just as legal.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generator-comparison
          path: |
            state/candidate_briefing.md
            state/today_briefing.md
            state/candidate_cost_log.jsonl
            state/candidate_debug/
            state/candidate_stories.md
